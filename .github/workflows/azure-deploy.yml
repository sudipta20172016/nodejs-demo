name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: sudiptaacr001
  ACR_LOGIN_SERVER: sudiptaacr001.azurecr.io
  IMAGE_NAME: nodejs-demo
  CONTAINER_APP_NAME: nodejs-demo
  RESOURCE_GROUP: aks-demo-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          BUILD_VERSION="$APP_VERSION-${{ github.run_number }}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.build_version }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.build_version }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.build_version }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Capture current deployed image
        id: current-deployment
        run: |
          PREVIOUS_IMAGE=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" \
            -o tsv)
          echo "previous_image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Previous image: $PREVIOUS_IMAGE"

      - name: Deploy to Azure Container Apps
        id: deploy
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.build_version }}

      - name: Verify latest deployment
        run: |
          PROVISIONING_STATE=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.provisioningState" \
            -o tsv)

          if [ "$PROVISIONING_STATE" != "Succeeded" ]; then
            echo "Deployment provisioning state is $PROVISIONING_STATE"
            exit 1
          fi

      - name: Roll back to previous image
        if: failure() && steps.current-deployment.outputs.previous_image != ''
        run: |
          echo "Rolling back to ${{ steps.current-deployment.outputs.previous_image }}"
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.current-deployment.outputs.previous_image }}
